name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Locate shaded jar
        id: jar
        run: |
          JAR=$(find target -maxdepth 1 -name "*.jar" ! -name "*-original.jar" | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      # ── Version / changelog ────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          # Write to a temp file to avoid shell quoting issues
          echo "$BODY" > /tmp/release_notes.md
          echo "file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # ── GitHub Packages (Maven) ────────────────────────────────────────────
      - name: Deploy to GitHub Packages
        run: mvn -B -DskipTests deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Append docs footer to release notes
        run: |
          printf '\n---\n[Documentation](https://ez-plugins.github.io/EzMine/) · [Modrinth](https://modrinth.com/plugin/ezmine)\n' >> /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EzMine ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          files: ${{ steps.jar.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Modrinth ──────────────────────────────────────────────────────────
      - name: Build Modrinth payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > /tmp/build_payload.py << 'PYEOF'
          import json, os
          changelog = open('/tmp/release_notes.md').read().strip()
          payload = {
              'name': 'EzMine ' + os.environ['VERSION'],
              'version_number': os.environ['VERSION'],
              'changelog': changelog,
              'dependencies': [
                  {'version_id': None, 'project_id': 'AwpXN7HO', 'dependency_type': 'optional'},  # EzSkills
                  {'version_id': None, 'project_id': 'rQtkf57Y', 'dependency_type': 'optional'},  # EzEconomy
                  {'version_id': None, 'project_id': 'Vebnzrzj', 'dependency_type': 'optional'},  # LuckPerms
                  {'version_id': None, 'project_id': 'DKY9btbd', 'dependency_type': 'optional'},  # WorldGuard
              ],
              'game_versions': [
                  '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
                  '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
                  '26.1', '26.1.1', '26.1.2',
              ],
              'version_type': 'release',
              'loaders': ['paper', 'folia', 'purpur', 'spigot', 'bukkit'],
              'featured': True,
              'project_id': 'yznSyKyp',
              'file_parts': ['file'],
              'primary_file': 'file',
          }
          json.dump(payload, open('/tmp/modrinth_payload.json', 'w'))
          PYEOF
          python3 /tmp/build_payload.py

      - name: Upload to Modrinth
        run: |
          curl --fail -s \
            -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" \
            -F "data=@/tmp/modrinth_payload.json;type=application/json" \
            -F "file=@${{ steps.jar.outputs.path }};type=application/java-archive" \
            "https://api.modrinth.com/v2/version"
