remote_theme: just-the-docs/just-the-docs

title: EzMine
description: >-
  Rank-aware mining enhancements for Spigot and Paper servers.
  Permission-driven ranks, drop multipliers, auto-smelt, fortune control,
  custom tools, and EzSkills / mcMMO integration — zero core edits required.

url: "https://ez-plugins.github.io"
baseurl: "/EzMine"

# ── Appearance ────────────────────────────────────────────────────────────────
color_scheme: ezmine
heading_anchors: true

# ── Header links ──────────────────────────────────────────────────────────────
aux_links:
  "GitHub":
    - "https://github.com/ez-plugins/EzMine"
  "Modrinth":
    - "https://modrinth.com/plugin/ezmine"
aux_links_new_tab: true

# ── Navigation ────────────────────────────────────────────────────────────────
nav_sort: case_insensitive
nav_external_links:
  - title: Changelog
    url: "https://github.com/ez-plugins/EzMine/releases"
    hide_icon: false

# ── Search ────────────────────────────────────────────────────────────────────
search_enabled: true
search:
  heading_level:        2
  previews:             3
  preview_words_before: 5
  preview_words_after:  10
  tokenizer_separator:  /[\s/]+/

# ── Footer ────────────────────────────────────────────────────────────────────
footer_content: >-
  EzMine is released under the
  <a href="https://opensource.org/licenses/MIT">MIT License</a>.

# ── Kramdown ──────────────────────────────────────────────────────────────────
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# ── Build exclusions ──────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
